<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 158" width="440" height="158" role="img" aria-label="qweninqwen: A real Qwen3-0.6B token computed by the weights and recurrent state of another, stock Qwen."><style>svg{--bg:#f6f8fa;--win:#ffffff;--bar:#eaeef2;--line:#d0d7de;--fg:#1f2328;--dim:#656d76;--a:#0969da;--b:#8250df;--ok:#1a7f37;--chip:#ddf4ff}@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--win:#0d1117;--bar:#161b22;--line:#30363d;--fg:#e6edf3;--dim:#8b949e;--a:#58a6ff;--b:#bc8cff;--ok:#3fb950;--chip:#12263f}}</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="var(--a)"/><stop offset="1" stop-color="var(--b)"/></linearGradient>
<linearGradient id="s" x1="0" x2="1"><stop offset="0" stop-color="var(--a)" stop-opacity="0"/><stop offset=".5" stop-color="var(--a)"/><stop offset="1" stop-color="var(--b)" stop-opacity="0"/></linearGradient>
<clipPath id="r"><rect x="1" y="1" width="438" height="156" rx="12"/></clipPath></defs>
<rect x="1" y="1" width="438" height="156" rx="12" fill="var(--win)" stroke="var(--line)" stroke-width="1.5"/>
<g clip-path="url(#r)"><rect x="-200" y="1" width="200" height="3" fill="url(#s)"><animateTransform attributeName="transform" type="translate" from="0 0" to="640 0" dur="5s" repeatCount="indefinite"/></rect></g>
<text x="22" y="38" font-size="18" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" fill="url(#g)">qweninqwen</text>
<rect x="321" y="21" width="97" height="22" rx="11" fill="var(--chip)"/>
<text x="369" y="36" font-size="11.5" text-anchor="middle" fill="var(--a)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">qwen / qwen</text>
<line x1="22" y1="54" x2="418" y2="54" stroke="var(--line)"/>
<text x="22" y="68" font-size="0"> </text><text x="22" y="84" font-size="13.5" fill="var(--fg)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">A real Qwen3-0.6B token computed by the weights</text><text x="22" y="103" font-size="13.5" fill="var(--fg)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">and recurrent state of another, stock Qwen.</text>
<text x="22" y="146" font-size="11" fill="var(--dim)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">github.com/Bobliuuu/qweninqwen</text>
<circle cx="414" cy="142" r="4" fill="var(--ok)"><animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/></circle>
</svg>