name: readme-lm
on:
  schedule: [{cron: "17 */3 * * *"}]
  workflow_dispatch:
    inputs:
      question: {description: "question about Jerry's GitHub", required: false, default: ""}
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency: readme-lm
jobs:
  answer:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'ask:')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT: ${{ github.event_name }}
      TITLE: ${{ github.event.issue.title }}
      ISSUE: ${{ github.event.issue.number }}
      INPUT: ${{ inputs.question }}
      RUN: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy
      - name: answer (model weights are read from README.md)
        run: |
          if [ "$EVENT" = issues ]; then Q="${TITLE#ask:}"; SEED="$ISSUE"; else Q="$INPUT"; SEED="$RUN"; fi
          python3 readme-lm/ask.py README.md assets/readme-lm.svg "$SEED" "$Q" > out.txt
          { echo "Question: \`$(printf '%s' "$Q" | tr -cd 'A-Za-z0-9 .,?_-')\`"; echo; echo '```'; cat out.txt; echo '```'; echo; echo "Answered by the 4-bit transformer stored inside the profile README (numpy forward pass). It only knows Jerry's public GitHub repos."; } > comment.md
      - name: commit animation
        run: |
          git config user.name "readme-lm[bot]"; git config user.email "readme-lm@users.noreply.github.com"
          git add assets/readme-lm.svg
          if ! git diff --cached --quiet; then git commit -m "chore: regenerate README-LM answer"; git pull --rebase -q; git push; fi
      - name: reply and close
        if: github.event_name == 'issues'
        run: |
          gh issue comment "$ISSUE" --body-file comment.md
          gh issue close "$ISSUE" --reason completed
