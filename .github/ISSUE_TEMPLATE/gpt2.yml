name: "GPT-2: continue any text"
description: "Real GPT-2 small (124M, int8) continues what you type; the profile animation shows the result"
title: "gpt2: example text"
body:
  - type: markdown
    attributes:
      value: |
        ## How this works
        1. Replace `example text` in the **title** above with anything you like, or type it in the box below. Anything works: a sentence start, a question, a line of code.
        2. Click **Submit new issue**.
        3. A GitHub Action runs the model and **the animation at the top of the profile changes to show the answer**. The bot also replies here and closes this issue (about 3 to 5 minutes).
  - type: input
    id: text
    attributes:
      label: Your text (optional)
      description: "If you fill this in, it is used instead of the text in the title."
      placeholder: "example text"
    validations:
      required: false
