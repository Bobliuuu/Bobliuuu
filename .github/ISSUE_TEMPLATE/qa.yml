name: "QA: ask the model about Jerry's GitHub"
description: "A 600K-parameter model stored inside the profile README answers questions about my repos"
title: "qa: example text"
body:
  - type: markdown
    attributes:
      value: |
        ## How this works
        1. Replace `example text` in the **title** above with anything you like, or type it in the box below. Try a question about my projects. Anything off-topic gets a polite refusal.
        2. Click **Submit new issue**.
        3. A GitHub Action runs the model and **the animation at the top of the profile changes to show the answer**. The bot also replies here and closes this issue (under a minute).
  - type: input
    id: text
    attributes:
      label: Your text (optional)
      description: "If you fill this in, it is used instead of the text in the title."
      placeholder: "example text"
    validations:
      required: false
